<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>cameras by Damien Seguin (https://github.com/dmnsgn)</title>
    <style>
      :root {
        --color-dark: #222222;
        --color-light: #f2f2f2;
        --color-accent: #95171d;
      }

      body {
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        font-family: sans-serif;
        color: var(--color-light);
        background-color: var(--color-dark);
      }

      header {
        position: absolute;
        top: 0;
        left: 20px;
        z-index: 1;
        color: var(--color-light);
        pointer-events: none;
      }
      nav {
        display: flex;
        flex-direction: column;
        gap: 10px;

        & > h2 {
          margin: 10px 0 0;
          font-size: 20px;
        }

        & > div {
          display: flex;
          gap: 10px;
        }
      }
      nav a {
        color: var(--color-light);
        pointer-events: auto;
        &[aria-current] {
          color: var(--color-accent);
        }
      }
      .tp-dfwv {
        max-height: stretch;
        overflow: auto;
        scrollbar-color: lch(from var(--color-dark) calc(l + 20) c h)
          var(--color-dark);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>cameras</h1>
      <nav>
        <h2>Controls</h2>
        <div>
          <a href="?id=orbit">Orbit</a>
          <a href="?id=map">Map</a>
          <a href="?id=first-person">First person</a>
          <a href="?id=fly">Fly</a>
          <a href="?id=trackball">Trackball</a>
        </div>
        <h2>Rigs</h2>
        <div>
          <a href="?id=shots">Shots</a>
          <a href="?id=rail">Rail</a>
          <a href="?id=crane">Crane</a>
          <a href="?id=switcher">Switcher</a>
          <a href="?id=framing">Framing</a>
          <a href="?id=follow-zoom">Follow zoom &amp; focus</a>
          <a href="?id=handheld">Handheld</a>
          <a href="?id=shake">Shake</a>
        </div>
        <a href="?id=input">Input debugger</a>
      </nav>
    </header>
    <script async src="web_modules/es-module-shims.js" type="module"></script>
    <script src="web_modules/import-map.json" type="importmap-shim"></script>

    <script type="module-shim">
      (async () => {
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        for (const link of document.querySelectorAll("header a")) {
          if (link.search === `?id=${id || "index"}`) {
            link.setAttribute("aria-current", "page");
          }
        }

        try {
          await importShim(`./examples/${id || "index"}.js`);
        } catch (error) {
          console.error(error);
          await importShim(`./examples/index.js`);
        }
      })();
    </script>
  </body>
</html>
